[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tei-crm-bridge"
version = "0.3.0"
description = "Traceable TEI enrichment and CIDOC CRM RDF for historical texts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["certifi>=2024.2.2", "lxml>=5,<7", "rdflib>=7,<9"]

[project.optional-dependencies]
ner = ["transformers>=4.44,<5", "torch>=2.3"]
test = ["pytest>=8,<10"]

[project.scripts]
tei-crm = "tei_crm_bridge.cli:main"
tei-crm-review = "tei_crm_bridge.review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: needs the pinned Impresso model (TCB_MODEL_TESTS=1)"]
