[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tei-crm-bridge"
version = "0.5.0"
description = "Traceable TEI enrichment and CIDOC CRM RDF for historical texts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["certifi>=2024.2.2", "lxml>=5,<7", "rdflib>=7,<9"]

[project.optional-dependencies]
ner = ["transformers>=4.44,<5", "torch>=2.3"]
test = ["pytest>=8,<10"]
store = ["pyoxigraph>=0.5,<0.6"]
validate = ["pyshacl>=0.30,<1"]
network = ["networkx>=3.2,<3.5"]

[project.scripts]
tei-crm = "tei_crm_bridge.cli:main"
tei-crm-review = "tei_crm_bridge.review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tei_crm_bridge = ["shapes/*.ttl"]

[tool.pytest.ini_options]
markers = ["integration: needs the pinned Impresso model (TCB_MODEL_TESTS=1)"]
